[build]
  command = "pnpm run build"
  publish = "dist/oaw/browser"

[build.environment]
  NODE_VERSION = "20"
  NODE_OPTIONS = "--max-old-space-size=8192"

[[plugins]]
  package = "@netlify/angular-runtime"

# oakwoodsys.com → Angular. WordPress en oakwoodsystemsgroup.com.
# Proxy solo para API (GraphQL, contact) — evita CORS
[[redirects]]
  from = "/api/graphql"
  to = "https://oakwoodsystemsgroup.com/graphql"
  status = 200
  force = true
  headers = {Cache-Control = "no-store, no-cache", Pragma = "no-cache"}

[[redirects]]
  from = "/api/contact"
  to = "https://oakwoodsystemsgroup.com/wp-json/oakwood/v1/send-contact"
  status = 200
  force = true

[[redirects]]
  from = "/api/contact-fields"
  to = "https://oakwoodsystemsgroup.com/wp-json/oakwood/v1/contact-fields"
  status = 200
  force = true

[[redirects]]
  from = "/api/eventbrite/*"
  to = "https://oakwoodsystemsgroup.com/wp-json/oakwood/v1/eventbrite/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/api/wordpress-page"
  to = "https://oakwoodsystemsgroup.com/wp-json/custom/v1/rendered-page"
  status = 200
  force = true
  headers = {Cache-Control = "public, max-age=60, stale-while-revalidate=300"}

# CMS JSON (home.json, services.json, service-*.json)
[[redirects]]
  from = "/api/cms/*"
  to = "https://oakwoodsystemsgroup.com/wp-content/uploads/oakwood-cms/:splat"
  status = 200
  force = true
  headers = {Cache-Control = "public, max-age=60, stale-while-revalidate=300"}

# Redirección /home → / (canonical home)
[[redirects]]
  from = "/home"
  to = "/"
  status = 301
  force = true

# WordPress admin: oakwoodsys.com/wp-admin → oakwoodsystemsgroup.com/wp-admin
[[redirects]]
  from = "/wp-admin"
  to = "https://oakwoodsystemsgroup.com/wp-admin"
  status = 301
  force = true

[[redirects]]
  from = "/wp-admin/*"
  to = "https://oakwoodsystemsgroup.com/wp-admin/:splat"
  status = 301
  force = true

# Redirección de dominio: www y HTTP → HTTPS en dominio principal
[[redirects]]
  from = "https://www.oakwoodsys.com/*"
  to = "https://oakwoodsys.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://oakwoodsys.com/*"
  to = "https://oakwoodsys.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://www.oakwoodsys.com/*"
  to = "https://oakwoodsys.com/:splat"
  status = 301
  force = true

# Sitemap y robots: servir archivos estáticos (antes del catch-all SPA)
[[redirects]]
  from = "/sitemap.xml"
  to = "/sitemap.xml"
  status = 200
  force = true

[[redirects]]
  from = "/robots.txt"
  to = "/robots.txt"
  status = 200
  force = true

# SSR: @netlify/angular-runtime maneja el catch-all (no usar /* → /index.html; bloquea SSR).

# Security headers (HTTPS + upgrade passive mixed content)
[[headers]]
  for = "/*"
  [headers.values]
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    Content-Security-Policy = "upgrade-insecure-requests"

# Build output is content-hashed (main-<hash>.js, styles-<hash>.css, chunk-<hash>.js) —
# a new deploy always ships new filenames, so caching forever is safe.
[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Static images/icons/fonts copied verbatim from public/assets — NOT content-hashed, so no
# `immutable`: a same-filename replacement (e.g. a swapped photo) should still reach visitors
# within a week rather than being stuck for a year.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"