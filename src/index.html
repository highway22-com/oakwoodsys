  <!-- bfcache fix: MSCI's WebTracking.bundle.js attaches an 'unload' listener, which
       disqualifies the page from back/forward cache (Chrome DevTools flagged this as
       UnloadHandlerExistsInMainFrame). The bundle doesn't honor disablePageUnloadEvents
       (tried, no effect — likely a thin custom wrapper, not the full AppInsights SDK
       config surface), so this intercepts at the browser API level instead: any
       'unload' listener registered anywhere on the page after this point is silently
       redirected to 'pagehide', which fires at the same moment but doesn't block
       bfcache. Must stay ABOVE the MSCI loader below so it's active before MSCI
       registers its listener. Verify via DevTools > Application > Back/forward cache > Test.
       NOTE: this block was missing from the last production deploy — confirm it's live
       after this file ships, since the bfcache failure will still reproduce without it. -->
  <script>
    (function () {
      var originalAddEventListener = window.addEventListener.bind(window);
      window.addEventListener = function (type, listener, options) {
        if (type === 'unload') {
          return originalAddEventListener('pagehide', listener, options);
        }
        return originalAddEventListener(type, listener, options);
      };
    })();
  </script>

  <!-- Chatbase — idle-load OR first user interaction, whichever comes first, so the widget
       is ready quickly for an engaged visitor without costing anything on initial load. -->
  <script id="chatbot-script-js-after">
    (function () {
      function initChatbase() {
        if (window.chatbase && window.chatbase("getState") === "initialized") {
          return;
        }
        if (!window.chatbase || window.chatbase("getState") !== "initialized") {
          window.chatbase = (...arguments) => {
            if (!window.chatbase.q) {
              window.chatbase.q = [];
            }
            window.chatbase.q.push(arguments);
          };
          window.chatbase = new Proxy(window.chatbase, {
            get(target, prop) {
              if (prop === "q") {
                return target.q;
              }
              return (...args) => target(prop, ...args);
            }
          });
        }
        const script = document.createElement("script");
        script.src = "https://www.chatbase.co/embed.min.js";
        script.id = "bW_eN1G3MHM4DA7uy64Ln";
        script.domain = "www.chatbase.co";
        script.async = true;
        document.body.appendChild(script);
      }

      function scheduleLoad() {
        if (window.requestIdleCallback) {
          window.requestIdleCallback(initChatbase, { timeout: 3000 });
        } else {
          setTimeout(initChatbase, 3000);
        }
      }

      function onFirstInteraction() {
        initChatbase();
        window.removeEventListener("pointerdown", onFirstInteraction);
        window.removeEventListener("keydown", onFirstInteraction);
      }

      window.addEventListener("pointerdown", onFirstInteraction, { once: true, passive: true });
      window.addEventListener("keydown", onFirstInteraction, { once: true, passive: true });

      if (document.readyState === "complete") {
        scheduleLoad();
      } else {
        window.addEventListener("load", scheduleLoad, { once: true });
      }
    })();
  </script>
