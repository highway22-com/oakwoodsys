<app-navbar></app-navbar>

<div id="wp-content-root">
  <section class="wordpress-page">
    <div *ngIf="loading()" class="min-h-screen flex items-center justify-center">
      <div class="animate-spin h-12 w-12 border-b-2 border-blue-600 rounded-full"></div>
    </div>

    <ng-container *ngIf="!loading()">
      <article class="wordpress-page__content" [innerHTML]="pageHtml()"></article>
    </ng-container>
  </section>
</div>

<app-footer></app-footer>
